name: Deploy production PWA to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Run acceptance checks
        run: node tests/acceptance.mjs

      - name: Assemble production artifact
        run: |
          mkdir _site
          cp index.html update.html styles.css manifest.webmanifest service-worker.js .nojekyll _site/
          cp -R src icons _site/
          test -f _site/index.html
          test -f _site/manifest.webmanifest
          test -f _site/service-worker.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
